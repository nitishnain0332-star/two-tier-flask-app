apiVersion: apps/v1
kind: Deployment
metadata:
  name: two-tier-app
  labels:
    app: two-tier-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: two-tier-app
  template:
    metadata:
      labels:
        app: two-tier-app
    spec:
      containers:
      - name: two-tier-app-pod
        image: 'nitishnain0332/nain033:latest'
        env:
          - name: MYSQL_HOST
            value: mysql
          - name: MYSQL_PASSWORD
            value: admin
          - name: MYSQL_USER
            value: admin
          - name: MYSQL_DB
            value: myDb
        ports:
          - containerPort: 5000
        imagePullPolicy: Always

