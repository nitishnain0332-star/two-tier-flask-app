apiVersion: v1
kind: Pod
metadata:
  name: two-tier-app-pod
spec:
  containers:
  - name: two-tier-app-pod
    image: nitishnain0332/nain033:latest 
    env:
      - name: MYSQL_HOST
        value: "mysql"          # this is your mysql's service clusture IP, Make sure to change it with yours
      - name: MYSQL_PASSWORD
        value: "admin"
      - name: MYSQL_USER
        value: "admin"
      - name: MYSQL_DB
        value: "myDb"
    ports:
      - containerPort: 5000
    imagePullPolicy: Always
     
